name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24"]
        include:
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # 单元测试全部离线（假 fetch），不依赖巨潮的可用性
      - name: Unit tests
        run: npm test

      - name: Build and smoke-test the packaged CLI
        shell: bash
        run: |
          npm pack
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install ../youhaozhao-cninfo-mcp-*.tgz
          test "$(npx cninfo-mcp --version)" = "$(node -p "require('../package.json').version")"
