name: 巨潮连通性探测

# 每 24 小时实际探测一次沪/深/北交所年报接口。
# 仅在探测到异常时通过 GitHub Issue 通知 repo owner（去重，不刷屏）。
on:
  schedule:
    - cron: "0 0 * * *" # 每天 00:00 UTC（北京时间 08:00）
  workflow_dispatch: {} # 允许手动触发

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install "requests>=2.31.0"

      - name: 运行连通性探测
        shell: bash
        run: python scripts/connectivity_probe.py | tee probe_output.txt

      - name: 异常时通知 repo owner（去重）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('probe_output.txt', 'utf8'); } catch (e) { output = '(无探测输出，可能在安装/启动阶段失败)'; }

            const label = 'connectivity-probe';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ts = new Date().toISOString();
            const block = '```\n' + output.trim() + '\n```';

            // 去重：若已存在同标签的未关闭 issue，则追加评论而非重复开 issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `🔁 探测于 ${ts} 再次失败：\n\n${block}\n\n运行详情：${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ 巨潮年报接口连通性探测失败（${ts.slice(0, 10)}）`,
                labels: [label],
                body: `定时探测检测到沪/深/北交所年报接口异常。\n\n${block}\n\n运行详情：${runUrl}\n\n> 本 issue 由「巨潮连通性探测」工作流自动创建。问题修复后请手动关闭；只要本 issue 处于开启状态，后续失败将以评论形式追加，不会重复开新 issue。`,
              });
            }
